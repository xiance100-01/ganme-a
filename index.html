<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Candy Crush Joy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff87a0, #ffc8dd);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px 80px 10px; /* 底部留白，不被广告遮挡 */
        }
        .game-title {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }
        .status-bar {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 18px;
        }
        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 48px);
            grid-template-rows: repeat(6, 48px);
            gap: 5px;
            background: rgba(255,255,255,0.25);
            padding: 12px;
            border-radius: 16px;
        }
        .candy-item {
            width: 48px;
            height: 48px;
            background: #ffffff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .candy-item.selected {
            box-shadow: 0 0 0 3px #ff3e6c;
        }
        .candy-item.remove-effect {
            animation: flash 0.3s ease forwards;
        }
        @keyframes flash {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.2); }
            100% { opacity: 0; transform: scale(0); }
        }
        .ad-button {
            margin-top: 22px;
            background: #f74778;
            color: #fff;
            border: none;
            padding: 12px 26px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .ad-button:disabled {
            opacity: 0.6;
        }
        /* 底部横幅广告容器 - 固定定位，不遮挡游戏 */
        #bottom-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
    </style>
    <!-- Monetag 广告SDK -->
    <script src="https://adserver.monetag.com/js/tag.js"></script>
</head>
<body>
    <h1 class="game-title">Candy Crush Joy</h1>
    <div class="status-bar">
        <span>Moves: <span id="moveCount">30</span></span>
        <span>Score: <span id="scoreCount">0</span></span>
    </div>
    <div class="game-board" id="gameBoard"></div>
    <button class="ad-button" id="rewardAdBtn">Watch Ad Get +10 Moves</button>

    <!-- 底部信息流横幅广告 -->
    <div id="bottom-banner">
        <!-- Monetag 自动横幅广告 -->
        <script>
            // 底部横幅广告自动加载（Telegram Mini App 专用）
            if (window.show_banner) {
                show_banner();
            }
        </script>
    </div>

<script>
const gridSize = 6;
const candyIcons = ['🍬','🍭','🍫','🍩','🧁','🍪'];
let gameGrid = [];
let moveNum = 30;
let gameScore = 0;
let selectPos = null;
let isAnimating = false;

const boardDom = document.getElementById('gameBoard');
const moveDom = document.getElementById('moveCount');
const scoreDom = document.getElementById('scoreCount');

// 游戏初始化
function initGame() {
    gameGrid = [];
    for(let r=0;r<gridSize;r++){
        gameGrid[r] = [];
        for(let c=0;c<gridSize;c++){
            gameGrid[r][c] = candyIcons[Math.floor(Math.random()*candyIcons.length)];
        }
    }
    renderBoard();
}

function renderBoard() {
    boardDom.innerHTML = '';
    for(let r=0;r<gridSize;r++){
        for(let c=0;c<gridSize;c++){
            let cell = document.createElement('div');
            cell.className = 'candy-item';
            cell.dataset.row = r;
            cell.dataset.col = c;
            cell.innerText = gameGrid[r][c];
            cell.addEventListener('click', () => cellClick(r,c));
            boardDom.appendChild(cell);
        }
    }
    moveDom.innerText = moveNum;
    scoreDom.innerText = gameScore;
}

async function cellClick(row, col) {
    if(isAnimating || moveNum<=0) return;
    if(!selectPos){ selectPos=[row,col]; return; }
    let [sr,sc] = selectPos;
    if(Math.abs(row-sr)+Math.abs(col-sc)!==1){ selectPos=[row,col]; return; }
    
    isAnimating=true;
    [gameGrid[row][col],gameGrid[sr][sc]]=[gameGrid[sr][sc],gameGrid[row][col]];
    renderBoard();
    await sleep(200);
    
    if(checkMatchExist()){
        moveNum--;
        await matchProcess();
    }else{
        [gameGrid[row][col],gameGrid[sr][sc]]=[gameGrid[sr][sc],gameGrid[row][col]];
        renderBoard();
    }
    selectPos=null;
    isAnimating=false;
}

async function matchProcess(){
    let mark=getMatchMark();
    await sleep(300);
    eliminateMatch(mark);
    dropNewCandy();
    renderBoard();
    while(checkMatchExist()){
        mark=getMatchMark();
        await sleep(300);
        eliminateMatch(mark);
        dropNewCandy();
        renderBoard();
    }
}

function checkMatchExist(){
    for(let r=0;r<gridSize;r++)for(let c=0;c<gridSize-2;c++)if(gameGrid[r][c]&&gameGrid[r][c]===gameGrid[r][c+1]&&gameGrid[r][c]===gameGrid[r][c+2])return true;
    for(let c=0;c<gridSize;c++)for(let r=0;r<gridSize-2;r++)if(gameGrid[r][c]&&gameGrid[r][c]===gameGrid[r+1][c]&&gameGrid[r][c]===gameGrid[r+2][c])return true;
    return false;
}

function getMatchMark(){
    let m=Array.from({length:gridSize},()=>Array(gridSize).fill(false));
    for(let r=0;r<gridSize;r++)for(let c=0;c<gridSize-2;c++)if(gameGrid[r][c]&&gameGrid[r][c]===gameGrid[r][c+1]&&gameGrid[r][c]===gameGrid[r][c+2])m[r][c]=m[r][c+1]=m[r][c+2]=true;
    for(let c=0;c<gridSize;c++)for(let r=0;r<gridSize-2;r++)if(gameGrid[r][c]&&gameGrid[r][c]===gameGrid[r+1][c]&&gameGrid[r][c]===gameGrid[r+2][c])m[r][c]=m[r+1][c]=m[r+2][c]=true;
    return m;
}

function eliminateMatch(mark){
    let cnt=0;
    for(let r=0;r<gridSize;r++)for(let c=0;c<gridSize;c++)if(mark[r][c]){gameGrid[r][c]=null;cnt++;}
    gameScore+=cnt*10;
}

function dropNewCandy(){
    for(let c=0;c<gridSize;c++){
        let t=[];
        for(let r=0;r<gridSize;r++)if(gameGrid[r][c])t.push(gameGrid[r][c]);
        for(let r=gridSize-1;r>=0;r--)gameGrid[r][c]=t.pop()||candyIcons[Math.floor(Math.random()*candyIcons.length)];
    }
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

// 奖励广告：看广告+10步（Rewarded Popup 官方代码）
document.getElementById('rewardAdBtn').addEventListener('click', function(){
    const btn = this;
    btn.innerText = "Loading...";
    btn.disabled = true;

    show_11050366('pop').then(() => {
        moveNum += 10;
        moveDom.innerText = moveNum;
        alert("✅ Success! +10 Moves");
    }).catch(e => {
        alert("⚠️ Ad Unavailable (VPN Only)");
    }).finally(() => {
        btn.innerText = "Watch Ad Get +10 Moves";
        btn.disabled = false;
    });
});

initGame();
</script>
</body>
</html>
