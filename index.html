<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candy Match Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fecfef);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .info {
            width: 100%;
            max-width: 380px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .board {
            display: grid;
            grid-template-columns: repeat(6, 50px);
            grid-template-rows: repeat(6, 50px);
            gap: 6px;
            background: rgba(255,255,255,0.3);
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .candy {
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .candy:active {
            transform: scale(0.92);
        }
        .ad-btn {
            margin-top: 18px;
            background: #ff4081;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .ad-btn:active {
            background: #d81b60;
        }
    </style>
    <!-- MONETAG SDK -->
    <script async src="https://adserver.monetag.com/js/tag.js"></script>
</head>
<body>

<div class="info">
    <div>步数: <span id="moves">30</span></div>
    <div>分数: <span id="score">0</span></div>
</div>

<div class="board" id="board"></div>

<button class="ad-btn" id="watchAdBtn">看广告 +10 步</button>

<script>
const SIZE = 6;
const CANDY = ['🍬', '🍭', '🍫', '🍩', '🧁', '🍪'];
let board = [];
let moves = 30;
let score = 0;
let selected = null;

const boardEl = document.getElementById('board');
const movesEl = document.getElementById('moves');
const scoreEl = document.getElementById('score');

// 初始化棋盘
function initBoard() {
    board = [];
    for (let r=0; r<SIZE; r++) {
        board[r] = [];
        for (let c=0; c<SIZE; c++) {
            board[r][c] = CANDY[Math.floor(Math.random()*CANDY.length)];
        }
    }
    render();
}

// 渲染界面
function render() {
    boardEl.innerHTML = '';
    for (let r=0; r<SIZE; r++) {
        for (let c=0; c<SIZE; c++) {
            const div = document.createElement('div');
            div.classList.add('candy');
            div.innerText = board[r][c];
            div.onclick = () => click(r,c);
            boardEl.appendChild(div);
        }
    }
    movesEl.innerText = moves;
    scoreEl.innerText = score;
}

// 点击逻辑（可交换+可消除）
function click(r,c) {
    if (moves <= 0) {
        alert("步数用完啦！看广告获得更多步数");
        return;
    }

    if (!selected) {
        selected = [r,c];
        return;
    }

    const [sr,sc] = selected;
    const dist = Math.abs(r-sr) + Math.abs(c-sc);
    if (dist !== 1) {
        selected = [r,c];
        return;
    }

    // 交换
    [board[r][c], board[sr][sc]] = [board[sr][sc], board[r][c]];
    
    // 检查是否能消除
    if (checkMatches()) {
        moves--;
        removeMatches();
        dropNewCandies();
    } else {
        // 不能消除 → 换回去
        [board[r][c], board[sr][sc]] = [board[sr][sc], board[r][c]];
    }

    selected = null;
    render();
}

// 检查是否有3个连在一起
function checkMatches() {
    for (let r=0; r<SIZE; r++) {
        for (let c=0; c<SIZE-2; c++) {
            const a = board[r][c];
            const b = board[r][c+1];
            const d = board[r][c+2];
            if (a===b && b===d) return true;
        }
    }
    for (let c=0; c<SIZE; c++) {
        for (let r=0; r<SIZE-2; r++) {
            const a = board[r][c];
            const b = board[r+1][c];
            const d = board[r+2][c];
            if (a===b && b===d) return true;
        }
    }
    return false;
}

// 消除并加分
function removeMatches() {
    let marked = Array.from({length:SIZE},()=>Array(SIZE).fill(false));

    // 横向
    for (let r=0; r<SIZE; r++) {
        for (let c=0; c<SIZE-2; c++) {
            const a = board[r][c];
            if (a && a===board[r][c+1] && a===board[r][c+2]) {
                marked[r][c] = marked[r][c+1] = marked[r][c+2] = true;
            }
        }
    }
    // 纵向
    for (let c=0; c<SIZE; c++) {
        for (let r=0; r<SIZE-2; r++) {
            const a = board[r][c];
            if (a && a===board[r+1][c] && a===board[r+2][c]) {
                marked[r][c] = marked[r+1][c] = marked[r+2][c] = true;
            }
        }
    }

    let count = 0;
    for (let r=0; r<SIZE; r++) {
        for (let c=0; c<SIZE; c++) {
            if (marked[r][c]) {
                board[r][c] = null;
                count++;
            }
        }
    }
    score += count * 10;
}

// 掉落新糖果
function dropNewCandies() {
    for (let c=0; c<SIZE; c++) {
        let col = [];
        for (let r=0; r<SIZE; r++) {
            if (board[r][c]) col.push(board[r][c]);
        }
        for (let r=SIZE-1; r>=0; r--) {
            board[r][c] = col.pop() || CANDY[Math.floor(Math.random()*CANDY.length)];
        }
    }
}

// ==================== MONETAG 广告 ====================
document.getElementById('watchAdBtn').onclick = function() {
    this.innerText = "加载广告中...";
    this.disabled = true;

    show_11050366().then(() => {
        moves += 10;
        render();
        alert("✅ 广告观看成功！+10 步！");
    }).catch(() => {
        alert("⚠️ 广告加载失败，请稍后再试");
    }).finally(() => {
        this.innerText = "看广告 +10 步";
        this.disabled = false;
    });
};

initBoard();
</script>
</body>
</html>
