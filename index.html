<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Candy Crush Joy</title>
    <!-- RichAds 官方SDK (你的ID已填入) -->
    <script src="https://richinfo.co/richpartners/telegram/js/tg-ob.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
        body {background:linear-gradient(135deg,#ff9a9e,#fecfef);min-height:100vh;padding:15px;display:flex;flex-direction:column;align-items:center;color:#fff}
        .game-title {font-size:28px;background:linear-gradient(to right,#ff6b6b,#ffd93d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:5px}
        .tip {font-size:12px;color:#ff4757;background:#fff;padding:4px 10px;border-radius:20px;margin-bottom:10px}
        .status {display:flex;gap:20px;background:rgba(255,255,255,.2);padding:10px 20px;border-radius:15px;margin-bottom:10px}
        .props {display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}
        .prop {width:50px;height:50px;border-radius:12px;border:none;background:#fff;font-size:22px;cursor:pointer}
        .board {display:grid;grid-template-columns:repeat(6,50px);grid-template-rows:repeat(6,50px);gap:6px;background:rgba(255,255,255,.3);padding:15px;border-radius:20px}
        .candy {width:50px;height:50px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:.3s}
        .candy.eliminate {animation:eliminate .5s forwards}
        .candy.fall {animation:fall .4s forwards}
        .candy.selected {transform:scale(1.1);border:3px solid #ff6b6b}
        .ad-buttons {margin-top:15px;display:flex;gap:10px}
        .ad-btn {padding:12px 20px;border-radius:30px;border:none;background:linear-gradient(to right,#ff3838,#ff6b6b);color:#fff;font-weight:bold}
        @keyframes eliminate {0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.5}100%{transform:scale(0);opacity:0}}
        @keyframes fall {0%{transform:translateY(-30px);opacity:0}100%{transform:translateY(0);opacity:1}}
    </style>
</head>
<body>
    <h1 class="game-title">CANDY CRUSH JOY</h1>
    <div class="tip">🎁 WATCH ADS GET FREE PROPS & MOVES!</div>

    <div class="status">
        <div>Steps: <span id="moves">30</span></div>
        <div>Score: <span id="score">0</span></div>
    </div>

    <div class="props">
        <button class="prop" id="bomb">💣</button>
        <button class="prop" id="swap">🔄</button>
        <button class="prop" id="hammer">🔨</button>
        <button class="prop" id="refresh">🔃</button>
        <button class="prop" id="addSteps">➕</button>
    </div>

    <div class="board" id="board"></div>

    <div class="ad-buttons">
        <button class="ad-btn" id="adSteps">🎬 WATCH AD +10 STEPS</button>
        <button class="ad-btn" id="adProp">🎁 WATCH AD GET PROP</button>
    </div>

<script>
    // 游戏核心配置
    const SIZE = 6;
    const CANDIES = ['🍬','🍭','🍫','🍩','🧁','🍪'];
    let board = [], moves=30, score=0, selected=null, isAnimating=false;
    const boardEl = document.getElementById('board');
    const movesEl = document.getElementById('moves');
    const scoreEl = document.getElementById('score');

    // 初始化棋盘
    function init(){
        board = [];
        for(let r=0;r<SIZE;r++){ board[r]=[]; for(let c=0;c<SIZE;c++) board[r][c] = CANDIES[Math.floor(Math.random()*CANDIES.length)]; }
        render();
    }

    // 渲染界面
    function render(){
        boardEl.innerHTML = '';
        for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE;c++){
            const d = document.createElement('div');
            d.classList.add('candy');
            d.dataset.r=r; d.dataset.c=c;
            d.innerText = board[r][c];
            d.onclick = ()=>click(r,c);
            boardEl.appendChild(d);
        }
        movesEl.innerText = moves;
        scoreEl.innerText = score;
    }

    // 点击交换
    async function click(r,c){
        if(isAnimating || moves<=0) return;
        if(!selected){ selected=[r,c]; sel(r,c,1); return; }
        const [sr,sc] = selected;
        if(adj(r,c,sr,sc)){
            swap(r,c,sr,sc);
            if(matches()){ moves--; await anim(); }else swap(r,c,sr,sc);
        }
        sel(sr,sc,0); selected=null; render();
    }

    // 辅助函数
    function sel(r,e,s){ document.querySelector(`[data-r="${r}"][data-c="${e}"]`).classList.toggle('selected',s); }
    function adj(r1,c1,r2,c2){ return (Math.abs(r1-r2)+Math.abs(c1-c2))===1; }
    function swap(r1,c1,r2,c2){ [board[r1][c1],board[r2][c2]] = [board[r2][c2],board[r1][c1]]; }

    // 检测消除
    function matches(){
        let m=false;
        for(let r=0;r<SIZE;r++) for(let c=0;c<SIZE-2;c++) if(board[r][c]&&board[r][c]==board[r][c+1]&&board[r][c]==board[r][c+2]){ m=true; board[r][c]=board[r][c+1]=board[r][c+2]=null; }
        for(let c=0;c<SIZE;c++) for(let r=0;r<SIZE-2;r++) if(board[r][c]&&board[r][c]==board[r+1][c]&&board[r][c]==board[r+2][c]){ m=true; board[r][c]=board[r+1][c]=board[r+2][c]=null; }
        return m;
    }

    // 消除动画+下落填充
    async function anim(){
        isAnimating=true;
        document.querySelectorAll('.candy').forEach((d,i)=>{ if(!board[Math.floor(i/SIZE)][i%SIZE]) d.classList.add('eliminate'); });
        await new Promise(r=>setTimeout(r,500));
        score+=50; fall(); fill();
        await new Promise(r=>setTimeout(r,400));
        if(matches()) await anim();
        isAnimating=false;
    }

    function fall(){ for(let c=0;c<SIZE;c++) for(let r=SIZE-1;r>0;r--) if(!board[r][c]){ board[r][c]=board[r-1][c]; board[r-1][c]=null; } }
    function fill(){ for(let c=0;c<SIZE;c++) if(!board[0][c]) board[0][c] = CANDIES[Math.floor(Math.random()*CANDIES.length)]; }

    // 道具功能
    document.getElementById('bomb').onclick=()=>{ board[2][2]=board[2][3]=board[3][2]=board[3][3]=null; anim(); };
    document.getElementById('swap').onclick=()=>alert("Click 2 candies to swap!");
    document.getElementById('hammer').onclick=()=>{ const r=Math.floor(Math.random()*SIZE),c=Math.floor(Math.random()*SIZE); board[r][c]=null; anim(); };
    document.getElementById('refresh').onclick=init;
    document.getElementById('addSteps').onclick=()=>{ moves+=5; render(); };

    // ==================== RichAds 广告(修复版，不崩溃) ====================
    window.TelegramAdsController = new TelegramAdsController();
    window.TelegramAdsController.initialize({ pubId: "1012691", appId: "7455" });

    // 看广告+步数
    document.getElementById('adSteps').onclick=()=>{
        try{ TelegramAdsController.showAd({adType:'rewarded',onSuccess:()=>{ moves+=10; render(); alert("✅ +10 Steps!"); }}); }
        catch(e){ alert("⚠️ Ad loading... Please try later!"); }
    };

    // 看广告领道具
    document.getElementById('adProp').onclick=()=>{
        try{ TelegramAdsController.showAd({adType:'rewarded',onSuccess:()=>{ alert("🎁 Free Bomb Unlocked!"); }}); }
        catch(e){ alert("⚠️ Ad loading... Please try later!"); }
    };

    // 启动游戏
    init();
</script>
</body>
</html>
