<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Candy Crush Joy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #ff87a0, #ffc8dd);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px 70px 10px;
        }
        .game-title {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }
        .status-bar {
            width: 100%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 18px;
        }
        .game-board {
            display: grid;
            grid-template-columns: repeat(6, 48px);
            grid-template-rows: repeat(6, 48px);
            gap: 5px;
            background: rgba(255,255,255,0.25);
            padding: 12px;
            border-radius: 16px;
        }
        .candy-item {
            width: 48px;
            height: 48px;
            background: #ffffff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .ad-button {
            margin-top: 22px;
            background: #f74778;
            color: #fff;
            border: none;
            padding: 12px 26px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .ad-button:disabled {
            opacity: 0.6;
        }
        /* 底部广告容器（适配Monetag In-app Interstitial） */
        #bottom-ad-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            z-index: 999;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
    <!-- 优先加载Monetag SDK（官方地址） -->
    <script src="https://adserver.monetag.com/js/tag.js"></script>
</head>
<body>
    <h1 class="game-title">Candy Crush Joy</h1>
    <div class="status-bar">
        <span>Moves: <span id="moveCount">30</span></span>
        <span>Score: <span id="scoreCount">0</span></span>
    </div>
    <div class="game-board" id="gameBoard"></div>
    <button class="ad-button" id="rewardAdBtn">Watch Ad Get +10 Moves</button>
    
    <!-- 底部广告容器 -->
    <div id="bottom-ad-container"></div>

<script>
// 游戏核心逻辑（保留不变）
const gridSize = 6;
const candyIcons = ['🍬','🍭','🍫','🍩','🧁','🍪'];
let gameGrid = [];
let moveNum = 30;
let gameScore = 0;
let selectPos = null;

const boardDom = document.getElementById('gameBoard');
const moveDom = document.getElementById('moveCount');
const scoreDom = document.getElementById('scoreCount');
const adBtn = document.getElementById('rewardAdBtn');

function initGame() {
    gameGrid = [];
    for(let r=0;r<gridSize;r++){
        gameGrid[r] = [];
        for(let c=0;c<gridSize;c++){
            gameGrid[r][c] = candyIcons[Math.floor(Math.random()*candyIcons.length)];
        }
    }
    renderBoard();
}

function renderBoard() {
    boardDom.innerHTML = '';
    for(let r=0;r<gridSize;r++){
        for(let c=0;c<gridSize;c++){
            let cell = document.createElement('div');
            cell.className = 'candy-item';
            cell.dataset.row = r;
            cell.dataset.col = c;
            cell.innerText = gameGrid[r][c];
            cell.addEventListener('click', () => cellClick(r,c));
            boardDom.appendChild(cell);
        }
    }
    moveDom.innerText = moveNum;
    scoreDom.innerText = gameScore;
}

function cellClick(row, col) {
    if(moveNum <= 0) return;
    if(!selectPos) { selectPos = [row,col]; return; }
    let [sr,sc] = selectPos;
    if(Math.abs(row-sr)+Math.abs(col-sc)===1) {
        [gameGrid[row][col],gameGrid[sr][sc]]=[gameGrid[sr][sc],gameGrid[row][col]];
        if(checkMatchExist()){
            moveNum--;
            processMatch();
        }else{
            [gameGrid[row][col],gameGrid[sr][sc]]=[gameGrid[sr][sc],gameGrid[row][col]];
        }
    }
    selectPos = null;
    renderBoard();
}

function checkMatchExist(){
    for(let r=0;r<gridSize;r++)for(let c=0;c<gridSize-2;c++)if(gameGrid[r][c]&&gameGrid[r][c]===gameGrid[r][c+1]&&gameGrid[r][c]===gameGrid[r][c+2])return true;
    for(let c=0;c<gridSize;c++)for(let r=0;r<gridSize-2;r++)if(gameGrid[r][c]&&gameGrid[r][c]===gameGrid[r+1][c]&&gameGrid[r][c]===gameGrid[r+2][c])return true;
    return false;
}

function processMatch(){
    let mark = Array(gridSize).fill().map(()=>Array(gridSize).fill(false));
    for(let r=0;r<gridSize;r++)for(let c=0;c<gridSize-2;c++)if(gameGrid[r][c]&&gameGrid[r][c]===gameGrid[r][c+1]&&gameGrid[r][c]===gameGrid[r][c+2])mark[r][c]=mark[r][c+1]=mark[r][c+2]=true;
    for(let c=0;c<gridSize;c++)for(let r=0;r<gridSize-2;r++)if(gameGrid[r][c]&&gameGrid[r][c]===gameGrid[r+1][c]&&gameGrid[r][c]===gameGrid[r+2][c])mark[r][c]=mark[r+1][c]=mark[r+2][c]=true;
    
    let count=0;
    for(let r=0;r<gridSize;r++)for(let c=0;c<gridSize;c++)if(mark[r][c]){gameGrid[r][c]=null;count++;}
    gameScore += count*10;

    for(let c=0;c<gridSize;c++){
        let temp=[];
        for(let r=0;r<gridSize;r++)if(gameGrid[r][c])temp.push(gameGrid[r][c]);
        for(let r=gridSize-1;r>=0;r--)gameGrid[r][c]=temp.pop()||candyIcons[Math.floor(Math.random()*candyIcons.length)];
    }
    
    if(checkMatchExist())processMatch();
}

// ==================== 广告核心修正 ====================
// 1. 激励广告（Rewarded Popup）- 用你官方给的调用方式
adBtn.addEventListener('click', async function(){
    const btn = this;
    btn.innerText = "Loading...";
    btn.disabled = true;

    // 超时保护（5秒）
    const timeoutPromise = new Promise((_, reject) => 
        setTimeout(() => reject(new Error('Ad timeout')), 5000)
    );

    try {
        // 你官方的Rewarded Popup调用：show_11050366('pop')
        await Promise.race([show_11050366('pop'), timeoutPromise]);
        // 广告播放完成 → 奖励
        moveNum += 10;
        moveDom.innerText = moveNum;
        alert("✅ Success! +10 Moves");
    } catch (e) {
        alert(`⚠️ Ad Failed: ${e.message}\nCheck Monetag activate status!`);
    } finally {
        btn.innerText = "Watch Ad Get +10 Moves";
        btn.disabled = false;
    }
});

// 2. 底部插屏广告（In-app Interstitial）- 官方调用方式
window.addEventListener('load', async () => {
    // 等待SDK加载完成
    await new Promise(resolve => setTimeout(resolve, 1000));
    // 调用你官方给的In-app Interstitial
    if (window.show_11050366) {
        show_11050366({
          type: 'inApp',
          inAppSettings: {
            frequency: 2,
            capping: 0.1,
            interval: 30,
            timeout: 5,
            everyPage: false
          }
        });
    }
});

// 初始化游戏
initGame();
</script>
</body>
</html>
